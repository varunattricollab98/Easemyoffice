name: Deploy Supabase Edge Functions

# Deploys every function under supabase/functions/ to the live Supabase project.
#
# Why this exists: three functions (daily-sales-report, notify-stale-followups,
# send-scheduled-reports) were missing from the live project entirely, because
# deploys were being run by hand and supabase/config.toml pointed at the wrong
# project ref. Automating it removes both failure modes — no local setup, and
# the ref comes from one place.
#
# One-time setup (repo owner, in the GitHub UI):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  SUPABASE_ACCESS_TOKEN
#     Value: a token from https://supabase.com/dashboard/account/tokens
#
# After that this runs automatically on every push to main that touches a
# function, and can also be triggered by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

# Never let two deploys race each other.
concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail early if the access token is missing
        # Checked inside run rather than via `if:`, because the `secrets`
        # context is not available in step-level if expressions. Without this
        # guard the deploy fails later with an opaque auth error.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "access token is present"

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --project-ref must match project_id in supabase/config.toml. It is the
        # public project ref (it appears in the API URL), not a secret.
        #
        # --use-api bundles server-side, so the runner needs no Docker. Supabase
        # explicitly recommends it for CI: it is faster and avoids a race
        # condition when several functions deploy in parallel.
        #
        # No function names = deploy all of them, which is idempotent and means
        # a newly added function can never be forgotten again.
        #
        # per-function settings such as verify_jwt are read from config.toml.
        run: |
          supabase functions deploy \
            --project-ref cfzwdlibvxksrxcrsvpp \
            --use-api

      - name: Verify functions respond
        # A deployed function replies 401 to an unauthenticated POST. A 404
        # means it is not actually there, which is the exact failure this
        # workflow was created to catch — so treat it as a hard error.
        run: |
          failed=0
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "https://cfzwdlibvxksrxcrsvpp.supabase.co/functions/v1/$fn" \
              -H 'Content-Type: application/json' -d '{}')"
            if [ "$code" = "404" ]; then
              echo "::error::$fn -> HTTP 404 (not deployed)"
              failed=1
            else
              echo "$fn -> HTTP $code (deployed)"
            fi
          done
          exit $failed
