name: Deploy Supabase Edge Functions

# Production deployments are limited to main and the explicit CRM project.
# SUPABASE_ACCESS_TOKEN must be a repository Actions secret.
# Pushes deploy changed functions; shared/config changes select all functions.
# Use workflow_dispatch on main to recover a failed/missed individual deploy.
# A workflow-only change must not redeploy every production function.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Exact function folder to deploy from main (one function)"
        required: true
        type: string
        default: send-client-email

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy edge functions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_REF: cfzwdlibvxksrxcrsvpp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select functions
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_FUNCTION: ${{ inputs.function_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          root = pathlib.Path("supabase/functions")
          names = {p.name for p in root.iterdir() if p.is_dir() and not p.name.startswith("_") and (p / "index.ts").is_file()}
          config = tomllib.loads(pathlib.Path("supabase/config.toml").read_text())
          if config.get("project_id") != os.environ["PROJECT_REF"]:
              raise SystemExit("Project ref mismatch; refusing production deployment")
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              selected = {os.environ["MANUAL_FUNCTION"]}
              if not selected <= names:
                  raise SystemExit("Select an existing function folder")
          else:
              before = os.environ["BEFORE_SHA"]
              if not before or not before.strip("0"):
                  raise SystemExit("No previous commit; dispatch intended functions manually")
              paths = subprocess.check_output(["git", "diff", "--name-only", "-z", before, os.environ["GITHUB_SHA"], "--", "supabase/functions", "supabase/config.toml"]).decode().split("\0")
              selected = set()
              for path in filter(None, paths):
                  if path == "supabase/config.toml":
                      selected.update(names)
                      continue
                  parts = path.split("/")
                  if len(parts) < 4 or parts[2].startswith("_"):
                      selected.update(names)
                  elif parts[2] in names:
                      selected.add(parts[2])
                  else:
                      print("Removed function folder; no automatic deletion:", parts[2])
          for name in selected:
              if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", name):
                  raise SystemExit("Unexpected function name")
          print("Selected:", ", ".join(sorted(selected)) or "none (no function changes)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("functions=" + " ".join(sorted(selected)), file=out)
          PY

      - name: Install Supabase CLI
        if: steps.select.outputs.functions != ''
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Deploy and verify selected functions
        if: steps.select.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SELECTED_FUNCTIONS: ${{ steps.select.outputs.functions }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time, tomllib, urllib.request
          project = os.environ["PROJECT_REF"]
          token = os.environ.get("SUPABASE_ACCESS_TOKEN")
          if not token:
              raise SystemExit("SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets")
          selected = os.environ["SELECTED_FUNCTIONS"].split()
          config = tomllib.loads(pathlib.Path("supabase/config.toml").read_text())
          if config.get("project_id") != project:
              raise SystemExit("Project ref mismatch")
          def metadata():
              req = urllib.request.Request(
                  f"https://api.supabase.com/v1/projects/{project}/functions",
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              if isinstance(data, dict):
                  data = data["functions"]
              return {item["slug"]: item for item in data}
          before = metadata()
          # Refuse accidental auth changes to existing functions. In particular,
          # callbacks/webhooks may have live JWT settings missing from config.toml.
          expected = {}
          for fn in selected:
              expected[fn] = config.get("functions", {}).get(fn, {}).get("verify_jwt", True)
              if fn in before and before[fn].get("verify_jwt") != expected[fn]:
                  raise SystemExit(f"{fn}: live JWT setting differs from config.toml; review and reconcile before deploy")
          # --yes is required by Supabase CLI v3 for unattended hosted changes.
          # --remote explicitly targets the project. Never pass --prune.
          for fn in selected:
              subprocess.run(["supabase", "functions", "deploy", fn,
                              "--remote=" + project, "--use-api", "--yes"], check=True)
              # Verify using read-only Management API metadata, not POST requests
              # to functions which may send mail, create invoices or write data.
              for attempt in range(5):
                  item = metadata().get(fn, {})
                  old_version = before.get(fn, {}).get("version", 0)
                  if (item.get("status") == "ACTIVE" and
                      item.get("version", 0) > old_version and
                      item.get("verify_jwt") == expected[fn]):
                      print(f"{fn}: ACTIVE version {item['version']}, JWT={item['verify_jwt']}", flush=True)
                      break
                  if attempt < 4:
                      time.sleep(5)
              else:
                  raise SystemExit(f"{fn}: deployment metadata verification failed")
          PY
