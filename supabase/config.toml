# Must match the LIVE Supabase project the app actually talks to
# (https://cfzwdlibvxksrxcrsvpp.supabase.co). This value is what the Supabase
# CLI uses for `db push`, `functions deploy`, and `link` — a stale ref here
# silently sends migrations and edge functions to the wrong project.
project_id = "cfzwdlibvxksrxcrsvpp"

[functions.send-scheduled-reports]
verify_jwt = false

# Server-side scheduled Gmail tag sync (see setup/ADD_GMAIL_TAG_SYNC_CRON.sql).
# Invoked by pg_cron with the anon key + CRON_SECRET in the body, not a user
# JWT, so JWT verification must be off (same as the other cron functions).
[functions.gmail-tag-sync]
verify_jwt = false
